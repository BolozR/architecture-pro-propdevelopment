apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["pods"]
      - group: "constraints.gatekeeper.sh"
        resources: ["*"]
  - level: Metadata
    resources:
      - group: "*"
        resources: ["*"]

