apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-03
  namespace: audit-zone
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10003
    runAsGroup: 10003
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

