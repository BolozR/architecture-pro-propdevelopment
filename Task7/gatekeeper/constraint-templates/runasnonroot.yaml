apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiresafepod
spec:
  crd:
    spec:
      names:
        kind: K8sRequireSafePod
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiresafepod

        violation[{"msg": "spec.securityContext.runAsNonRoot должен быть true"}] {
          input.review.object.kind == "Pod"
          not input.review.object.spec.securityContext.runAsNonRoot
        }

        violation[{"msg": msg}] {
          input.review.object.kind == "Pod"
          container := input.review.object.spec.containers[_]
          not container.securityContext.readOnlyRootFilesystem
          msg := sprintf("readOnlyRootFilesystem обязателен для контейнера %v", [container.name])
        }

